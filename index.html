<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13715A">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Xiǎo Lǎoshī</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: a phone-first study app. Celadon porcelain ground, ink text, jade accent,
   seal-red stamps for menu badges; pinyin coloured by tone (1 red, 2 amber, 3 green, 4 blue). */
:root{
  --paper:#EEF3EF; --card:#FFFFFF; --ink:#17201C; --muted:#5A6A63; --line:#D5E0D9;
  --jade:#13715A; --jade-ink:#FFFFFF; --jade-soft:#DDEEE6; --seal:#B3352B; --seal-soft:#F6E3E0;
  --good:#1D7D45; --good-soft:#DFF2E6; --bad:#B42F2F; --bad-soft:#F8E1E1;
  --t1:#C93A2A; --t2:#B97400; --t3:#22803A; --t4:#2459BE; --t5:#7D8A84;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-hz:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ui:"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-sc:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --card:#18201D; --ink:#E4ECE7; --muted:#93A39B; --line:#2A3631;
  --jade:#52C4A0; --jade-ink:#06231A; --jade-soft:#17342A; --seal:#E0685C; --seal-soft:#3A1F1C;
  --good:#5BCB86; --good-soft:#163323; --bad:#F07C7C; --bad-soft:#3A1C1C;
  --t1:#FF7A66; --t2:#F2B33D; --t3:#62D07A; --t4:#79A6FF; --t5:#8E9C96;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1513; --card:#18201D; --ink:#E4ECE7; --muted:#93A39B; --line:#2A3631;
  --jade:#52C4A0; --jade-ink:#06231A; --jade-soft:#17342A; --seal:#E0685C; --seal-soft:#3A1F1C;
  --good:#5BCB86; --good-soft:#163323; --bad:#F07C7C; --bad-soft:#3A1C1C;
  --t1:#FF7A66; --t2:#F2B33D; --t3:#62D07A; --t4:#79A6FF; --t5:#8E9C96;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.hz{font-family:var(--f-hz);font-weight:600}
.sc{font-family:var(--f-sc)}
.muted{color:var(--muted)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.py{font-family:var(--f-ui);letter-spacing:.01em}

.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
.brand .hz{font-size:26px;font-weight:900;letter-spacing:.04em}
.brand .py{color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t5)}
.dot.on{background:var(--good)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.tab .hz{font-size:18px;line-height:1.2}
.tab small{font-size:11px}
.tab[aria-current="true"]{color:var(--jade)}
.tab[aria-current="true"] .hz{font-weight:900}

h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:19px}
h3{font-size:16px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.btn.block{width:100%;justify-content:center;min-height:48px;font-size:16px}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn.lg{width:72px;height:72px;background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.lg svg{width:30px;height:30px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--ink)}

/* today */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .big{font-family:var(--f-hz);font-weight:900;font-size:56px;line-height:1;color:var(--jade)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-height:96px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--jade)}
.mode .hz{font-size:22px}
.mode b{font-size:14px}
.mode span{font-size:12.5px;color:var(--muted)}
.mode .due{align-self:flex-start;font-size:11px;background:var(--seal-soft);color:var(--seal);border-radius:999px;padding:1px 8px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:3px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.qhead{display:flex;align-items:center;gap:12px}
.pips{display:flex;gap:6px;flex:1}
.pips i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pips i.ok{background:var(--good)}.pips i.no{background:var(--bad)}.pips i.cur{background:var(--jade)}
.prompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px}
.prompt .label{font-size:13px;color:var(--muted);font-weight:600}
.prompt .hzbig{font-family:var(--f-hz);font-weight:600;font-size:44px;line-height:1.25;word-break:break-all}
.prompt .hzmed{font-family:var(--f-hz);font-weight:600;font-size:28px;line-height:1.4}
.playrow{display:flex;gap:14px;align-items:center;justify-content:center}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--jade)}
.opt .k{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;flex:none;margin-top:2px}
.opt .ot{display:flex;flex-direction:column;min-width:0}
.opt .ot .hz{font-size:20px}
.opt .ot .py{font-size:13px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.answerline{border-bottom:2px dashed var(--line);padding-block:8px;justify-content:flex-start}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-family:var(--f-hz);font-weight:600;font-size:22px;box-shadow:var(--shadow)}
.tile.used{visibility:hidden}
.numin{font-size:28px;text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.feedback{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback .verdict{font-weight:700}
.feedback.ok .verdict{color:var(--good)}
.feedback.no .verdict{color:var(--bad)}
.reveal .hz{font-size:24px}
.why{font-size:14px}
.sticky-next{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));}

/* summary */
.sumlist{display:flex;flex-direction:column;gap:6px}
.sumrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sumrow .mk{font-weight:700;width:18px}
.sumrow .mk.ok{color:var(--good)}.sumrow .mk.no{color:var(--bad)}

/* menu */
.menu-sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 18px;box-shadow:var(--shadow);position:relative}
.menu-sheet::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
.menu-head{text-align:center;display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.menu-head .hz{font-size:30px;font-weight:900;letter-spacing:.2em}
.msec{margin-top:18px}
.msec-h{display:flex;align-items:baseline;gap:10px;justify-content:center;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.msec-h .hz{font-size:20px;letter-spacing:.3em}
.dish{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 2px;border-bottom:1px dotted var(--line)}
.dish-line{display:flex;align-items:baseline;gap:8px}
.dish-line .hz{font-size:19px}
.lead{flex:1;border-bottom:1px dotted var(--muted);opacity:.5;transform:translateY(-4px);min-width:12px}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.price small{color:var(--muted);font-weight:400}
.stamp{font-family:var(--f-hz);font-weight:900;font-size:11px;color:var(--seal);border:1.5px solid var(--seal);border-radius:3px;padding:0 3px;transform:rotate(-6deg);display:inline-block;line-height:1.4}
.chili{color:var(--seal);font-family:var(--f-hz);font-size:12px;font-weight:900;letter-spacing:-1px}
.dish-sub{font-size:13px;margin-top:2px}
.dish-detail{background:var(--paper);border-radius:10px;padding:12px;margin:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.break{display:flex;flex-wrap:wrap;gap:6px}
.break span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px}
.break .hz{font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.phr{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.phr .tx{flex:1;min-width:0}
.phr .hz{font-size:19px}

/* grammar */
.glist{display:grid;gap:8px}
.gitem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.gitem:hover{border-color:var(--jade)}
.gitem .hz{font-size:22px;text-align:center;color:var(--jade);line-height:1.2}
.gitem b{font-size:14px;display:block}
.gitem small{color:var(--muted)}
.gitem .mini{width:54px}
.structure{font-family:var(--f-sc);background:var(--jade-soft);border-radius:10px;padding:10px 12px;font-weight:500}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ex .tx{flex:1;min-width:0}
.ex .hz{font-size:20px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.msg.w{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--jade-soft);align-self:flex-end}
.msg .hz{font-size:19px}
.fix{font-size:13px;border-left:3px solid var(--t2);padding-left:8px}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{resize:vertical;min-height:70px}
.hidden-text{filter:blur(6px);cursor:pointer;user-select:none}
.note{font-size:13px;background:var(--paper);border-radius:10px;padding:10px 12px}
.warn{background:var(--seal-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.scan-card{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.scan-card .hz{font-size:20px}
.out{white-space:pre-wrap;font-size:14px}
label.sw{display:flex;align-items:center;gap:8px;font-size:14px}
.kbd-hint{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.kbd-hint{display:none}}
@media (prefers-reduced-motion: no-preference){
  .opt,.tile,.btn,.mode{transition:border-color .15s,background-color .15s,transform .1s}
  .tile:active,.opt:active:not([disabled]){transform:scale(.98)}
  .pulse{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.6}}
}
@media (max-width:420px){.prompt .hzbig{font-size:38px}.hero .big{font-size:46px}}

/* Hold Shift: pinyin over every character */
ruby.xlpy{ruby-position:over;ruby-align:center}
ruby.xlpy rt{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.48em;font-weight:500;letter-spacing:0;line-height:1;text-transform:none;font-style:normal}
body.shiftpy .py{display:none}
.shiftpy-tip{font-size:13px}
.shiftpy-tip kbd{border:1px solid var(--line,#888);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="hz">小老师</span><span class="py">xiǎo lǎo shī</span></div>
    <div class="sync" id="sync"><i class="dot"></i><span>This device</span></div>
  </header>
  <main id="main"><div class="card">Loading lessons…</div></main>
</div>
<div class="tabbar"><nav id="tabs"></nav></div>

<script>
/* ===================== CONTENT ===================== */
/* Pinyin is written syllable by syllable so it can be tone-coloured. */

const RESTAURANT = { zh: "福来小馆", py: "Fú lái xiǎo guǎn", en: "Fulai Bistro (practice menu)" };

/* unit: what the dish is counted in. tag: 招牌 signature / 推荐 recommended / 新 new. spicy 0-3 */
const MENU = [
  { sec: "凉菜", secPy: "liáng cài", secEn: "Cold dishes", items: [
    { zh: "拍黄瓜", py: "pāi huáng guā", en: "Smashed cucumber", p: 18, u: "份", spicy: 0 },
    { zh: "凉拌木耳", py: "liáng bàn mù ěr", en: "Wood-ear mushroom salad", p: 22, u: "份", spicy: 1 },
    { zh: "口水鸡", py: "kǒu shuǐ jī", en: "Mouth-watering chicken", p: 38, u: "份", spicy: 2, tag: "推荐", note: "口水 literally means saliva: it's so good your mouth waters. Cold poached chicken in chilli oil." },
    { zh: "皮蛋豆腐", py: "pí dàn dòu fu", en: "Century egg with tofu", p: 20, u: "份", spicy: 0, note: "皮蛋 is a preserved duck egg with a dark jelly-like white." }
  ]},
  { sec: "热菜", secPy: "rè cài", secEn: "Hot dishes", items: [
    { zh: "宫保鸡丁", py: "gōng bǎo jī dīng", en: "Kung pao chicken", p: 42, u: "份", spicy: 1, tag: "招牌", note: "丁 = diced. Chicken cubes with peanuts and dried chilli." },
    { zh: "鱼香肉丝", py: "yú xiāng ròu sī", en: "Fish-fragrant pork strips", p: 38, u: "份", spicy: 1, note: "No fish! 鱼香 is a sweet, sour and garlicky Sichuan sauce. 丝 = shredded." },
    { zh: "麻婆豆腐", py: "má pó dòu fu", en: "Mapo tofu", p: 28, u: "份", spicy: 2, note: "Tofu with minced beef or pork in a numbing (麻) chilli sauce." },
    { zh: "红烧肉", py: "hóng shāo ròu", en: "Red-braised pork belly", p: 58, u: "份", spicy: 0, tag: "招牌", note: "红烧 = braised in soy sauce and sugar. 肉 alone almost always means pork." },
    { zh: "糖醋里脊", py: "táng cù lǐ ji", en: "Sweet and sour pork", p: 46, u: "份", spicy: 0 },
    { zh: "回锅肉", py: "huí guō ròu", en: "Twice-cooked pork", p: 45, u: "份", spicy: 2, note: "回锅 = back into the wok: boiled, sliced, then stir-fried." },
    { zh: "西红柿炒鸡蛋", py: "xī hóng shì chǎo jī dàn", en: "Tomato and egg stir-fry", p: 26, u: "份", spicy: 0, note: "The classic home-style dish. Safe, cheap, everywhere." },
    { zh: "地三鲜", py: "dì sān xiān", en: "Potato, eggplant and capsicum", p: 32, u: "份", spicy: 0, note: "Literally 'three fresh things from the earth'. Vegetarian (check for pork fat)." },
    { zh: "干煸四季豆", py: "gān biān sì jì dòu", en: "Dry-fried green beans", p: 30, u: "份", spicy: 1 },
    { zh: "清蒸鱼", py: "qīng zhēng yú", en: "Steamed whole fish", p: 88, u: "条", spicy: 0, note: "清蒸 = plain steamed. Often priced 时价 (market price) or by the 斤 (500 g)." },
    { zh: "水煮牛肉", py: "shuǐ zhǔ niú ròu", en: "Sichuan boiled beef", p: 68, u: "份", spicy: 3, note: "Sounds gentle (water-boiled) but comes swimming in chilli oil." },
    { zh: "蒜蓉西兰花", py: "suàn róng xī lán huā", en: "Garlic broccoli", p: 26, u: "份", spicy: 0 },
    { zh: "北京烤鸭", py: "Běi jīng kǎo yā", en: "Peking duck (half)", p: 98, u: "只", spicy: 0, tag: "招牌", note: "Ordered as 半只 (half) or 一只 (whole). Comes with pancakes, cucumber and sauce." }
  ]},
  { sec: "汤", secPy: "tāng", secEn: "Soups", items: [
    { zh: "酸辣汤", py: "suān là tāng", en: "Hot and sour soup", p: 22, u: "碗", spicy: 1 },
    { zh: "西红柿鸡蛋汤", py: "xī hóng shì jī dàn tāng", en: "Tomato egg drop soup", p: 18, u: "碗", spicy: 0 },
    { zh: "紫菜蛋花汤", py: "zǐ cài dàn huā tāng", en: "Seaweed egg soup", p: 16, u: "碗", spicy: 0 }
  ]},
  { sec: "主食", secPy: "zhǔ shí", secEn: "Rice, noodles and dumplings", items: [
    { zh: "米饭", py: "mǐ fàn", en: "Steamed rice", p: 3, u: "碗", spicy: 0 },

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 86400000;
const dkey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayKey = () => dkey(new Date());
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const rand = a => a[Math.floor(Math.random() * a.length)];
const isPunct = t => /^[，。？！、,.?!]+$/.test(t);
const joinZh = s => s.split(" ").join("");

const TONE = {};
"āēīōūǖĀĒĪŌŪ".split("").forEach(c => TONE[c] = 1);
"áéíóúǘÁÉÍÓÚ".split("").forEach(c => TONE[c] = 2);

function pyHtml(py) { return String(py || "").split(" ").map(s => `<span class="t${toneOf(s)}">${esc(s)}</span>`).join(" "); }

const DISHES = MENU.flatMap(s => s.items.map(it => ({ ...it, sec: s.sec })));
const WORDMAP = Object.fromEntries(MENU_WORDS.map(w => [w[0], w]));
function segment(zh) {
  const out = []; let i = 0;
  while (i < zh.length) {
    let hit = null;
    for (let L = 3; L >= 1; L--) { const s = zh.slice(i, i + L); if (WORDMAP[s]) { hit = s; break; } }
    if (hit) { out.push([hit, WORDMAP[hit]]); i += hit.length; } else { out.push([zh[i], null]); i++; }
  }
  return out;
}
function orderPhrase(d) {
  if (d.u === "两") return { zh: "来三两" + d.zh, py: "lái sān liǎng " + d.py };
  if (d.u === "只") return { zh: "来半只" + d.zh, py: "lái bàn zhī " + d.py };
  const U = UNITS[d.u] || ["gè", 4];
  return { zh: "来一" + d.u + d.zh, py: `lái ${U[1] === 4 ? "yí" : "yì"} ${U[0]} ${d.py}` };
}
function numZh(n) {
  const d = "零一二三四五六七八九";
  const teen = r => "一十" + (r % 10 ? d[r % 10] : "");
  if (n < 10) return d[n];
  if (n < 20) return "十" + (n % 10 ? d[n % 10] : "");
  if (n < 100) return d[Math.floor(n / 10)] + "十" + (n % 10 ? d[n % 10] : "");
  if (n < 1000) {
    const h = Math.floor(n / 100), r = n % 100, s = (h === 2 ? "两" : d[h]) + "百";
    if (!r) return s; if (r < 10) return s + "零" + d[r]; return s + (r < 20 ? teen(r) : numZh(r));
  }
  const t = Math.floor(n / 1000), r = n % 1000, s = (t === 2 ? "两" : d[t]) + "千";
  if (!r) return s; if (r < 100) return s + "零" + (r < 10 ? d[r] : r < 20 ? teen(r) : numZh(r)); return s + numZh(r);
}

/* ===================== PROGRESS STORE ===================== */
const LS_KEY = "xiaolaoshi.v1";
const DEFAULT = () => ({ v: 1, items: {}, days: {}, area: {}, customs: [], settings: { rate: 0.9, voice: "", pinyin: true, menuPy: false, menuEn: false } });
function normalise(o) { const b = DEFAULT(); o = o || {}; return { ...b, ...o, settings: { ...b.settings, ...(o.settings || {}) }, items: o.items || {}, days: o.days || {}, area: o.area || {}, customs: o.customs || [] }; }
let P = DEFAULT();
try { const s = localStorage.getItem(LS_KEY); if (s) P = normalise(JSON.parse(s)); } catch (e) { }

const store = { ref: null, mode: "local", pushing: false, again: false, timer: null };
function setSync(mode) {
  store.mode = mode;
  const el = $("#sync"); if (!el) return;
  const txt = { cloud: "Saved to your account", local: "Saved on this device", error: "Sync paused" }[mode];
  el.innerHTML = `<i class="dot ${mode === "cloud" ? "on" : ""}"></i><span>${txt}</span>`;
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) { }
  clearTimeout(store.timer); store.timer = setTimeout(pushRemote, 1500);
}
async function pushRemote() {
  if (!store.ref) return;
  if (store.pushing) { store.again = true; return; }
  store.pushing = true;
  try { await store.ref.set(JSON.parse(JSON.stringify(P))); setSync("cloud"); }
  catch (e) { setSync("error"); }
  store.pushing = false;
  if (store.again) { store.again = false; pushRemote(); }
}
function mergeProgress(a, b) {
  const out = normalise(b);
  for (const [k, v] of Object.entries(a.items)) { const r = out.items[k]; if (!r || (v.seen || 0) > (r.seen || 0)) out.items[k] = v; }
  for (const [k, v] of Object.entries(a.days)) { const r = out.days[k]; if (!r || v.n > r.n) out.days[k] = v; }
  for (const [k, v] of Object.entries(a.area)) { const r = out.area[k]; if (!r || v.n > r.n) out.area[k] = v; }
  const have = new Set(out.customs.map(c => c.zh));
  a.customs.forEach(c => { if (!have.has(c.zh)) out.customs.push(c); });
  return out;
}
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    const before = JSON.stringify(P);
    if (snap.exists) P = mergeProgress(P, snap.data());
    store.ref = ref; setSync("cloud");
    const changed = !snap.exists || JSON.stringify(normalise(snap.data())) !== JSON.stringify(P);
    try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) { }
    if (changed && Object.keys(P.items).length) pushRemote();
    if (before !== JSON.stringify(P) && !S) render();
  } catch (e) { setSync("local"); }
}

function grade(key, ok, area) {
  const now = Date.now();
  const it = P.items[key] || { reps: 0, int: 0, ease: 2.3, seen: 0, right: 0, due: 0 };
  it.seen++;
  if (ok) {
    it.right++; it.reps++;
    it.int = it.reps === 1 ? 1 : it.reps === 2 ? 3 : Math.round(it.int * it.ease);
    it.ease = Math.min(3, it.ease + 0.05); it.due = now + it.int * DAY;
  } else {
    it.reps = 0; it.int = 0; it.ease = Math.max(1.3, it.ease - 0.2); it.due = now + 10 * 60000;
  }
  P.items[key] = it; tally(area, ok);
}
function tally(area, ok) {
  const d = todayKey(); const day = P.days[d] || { n: 0, c: 0 }; day.n++; if (ok) day.c++; P.days[d] = day;
  const a = P.area[area] || { n: 0, c: 0 }; a.n++; if (ok) a.c++; P.area[area] = a;
}
function keysFor(p) {
  switch (p) {
    case "LM": return LISTEN.map((_, i) => "LM:" + i);
    case "LB": return LISTEN.map((_, i) => "LB:" + i);
    case "TN": return TONE_WORDS.map((_, i) => "TN:" + i);
    case "MC": return MENU_WORDS.map((_, i) => "MC:" + i);

  let h = `<div class="reveal stack" style="gap:4px">`;
  if (r.zh) h += `<div class="row"><span class="hz">${esc(r.zh)}</span>${spk(r.zh)}<button class="iconbtn" data-act="slow" data-t="${esc(r.zh)}" aria-label="Play slowly">${ICON.slow}</button></div>`;
  if (r.py) h += `<div class="py">${pyHtml(r.py)}</div>`;
  if (r.en) h += `<div>${esc(r.en)}</div>`;
  h += `</div>`;
  if (q.dish) h += `<div class="break">${segment(q.dish.zh).map(([t, w]) => `<span><b class="hz">${esc(t)}</b> ${w ? `<span class="py">${pyHtml(w[1])}</span> ${esc(w[2])}` : ""}</span>`).join("")}</div>`;
  return h;
}
function viewQuiz() {
  const q = S.qs[S.i], n = S.qs.length;
  const pips = S.qs.map((_, k) => `<i class="${k < S.res.length ? (S.res[k].ok ? "ok" : "no") : k === S.i ? "cur" : ""}"></i>`).join("");
  let h = `<section class="quiz"><div class="qhead"><button class="iconbtn" data-act="quit" aria-label="End round">${ICON.x}</button><div class="pips">${pips}</div><span class="muted" style="font-variant-numeric:tabular-nums">${S.i + 1}/${n}</span></div>`;
  h += `<div class="card prompt"><div class="label">${esc(q.label)}</div>`;
  if (q.audio) {
    h += `<div class="playrow"><button class="iconbtn lg" data-act="replay" aria-label="Play">${ICON.play}</button><button class="iconbtn" data-act="replay-slow" aria-label="Play slowly">${ICON.slow}</button></div>`;
    if (q.hideText && !S.answered) h += S.showText ? `<div class="hzmed">${esc(q.reveal.zh)}</div><div class="py">${pyHtml(q.reveal.py)}</div>` : `<button class="btn sm ghost" data-act="showtext">Show the text</button>`;
  }
  if (q.show) h += q.plainShow ? `<div style="font-weight:600">${esc(q.show)}</div>` : `<div class="${q.big ? "hzbig" : "hzmed"}">${esc(q.show)}</div>`;
  if (q.en) h += `<div style="font-size:17px;font-weight:600">${esc(q.en)}</div>`;
  if (q.kind === "order" && q.hint && !S.answered) h += S.hint ? `<div class="muted">${esc(q.hint)}</div>` : `<button class="btn sm ghost" data-act="hint">Show English hint</button>`;
  h += `</div>`;

  if (q.kind === "choice") {
    h += `<div class="opts">` + q.opts.map((o, k) => {
      let cls = "opt";
      if (S.answered) { if (k === q.answer) cls += " right"; else if (k === S.sel) cls += " wrong"; }
      let inner;
      if (typeof o === "string") inner = `<span>${esc(o)}</span>`;
      else if (o.html) inner = `<span style="font-size:18px;font-weight:700">${o.html}</span>`;
      else inner = `<span class="hz">${esc(o.zh)}</span>${o.py && (P.settings.pinyin || S.answered) ? `<span class="py">${pyHtml(o.py)}</span>` : ""}${S.answered && q.optEn ? `<span class="muted" style="font-size:13px">${esc(q.optEn[k])}</span>` : ""}`;
      return `<button class="${cls}" data-act="choose" data-i="${k}" ${S.answered ? "disabled" : ""}><span class="k">${k + 1}</span><span class="ot">${inner}</span></button>`;
    }).join("") + `</div>`;
  } else if (q.kind === "order") {
    h += `<div class="tiles answerline">${S.placed.map((ti, pos) => `<button class="tile" data-act="untile" data-pos="${pos}" ${S.answered ? "disabled" : ""}>${esc(q.tiles[ti])}</button>`).join("") || `<span class="muted" style="align-self:center">Tap the words below in order</span>`}</div>`;
    if (!S.answered) {
      h += `<div class="tiles">${q.tiles.map((t, i) => `<button class="tile ${S.placed.includes(i) ? "used" : ""}" data-act="tile" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
      h += `<div class="row" style="justify-content:center"><button class="btn" data-act="cleartiles">Clear</button><button class="btn primary" data-act="checkorder" ${S.placed.length ? "" : "disabled"}>Check</button></div>`;
    }
  } else if (q.kind === "input") {
    h += `<form data-form="num" class="stack"><input class="numin" id="numin" inputmode="decimal" autocomplete="off" placeholder="${esc(q.placeholder)}" value="${esc(S.input)}" ${S.answered ? "disabled" : ""}>${S.answered ? "" : `<button class="btn primary block" type="submit">Check</button>`}</form>`;
  }

  if (S.answered) {
    let why = q.why || "";
    if (q.whys && S.sel !== q.answer && S.sel != null) why = q.whys[S.sel] || why;
    if (q.kind === "input" && !S.ok) why = `Answer: <b>${esc(q.answerText)}</b>. ` + esc(why); else why = esc(why);
    if (q.kind === "order" && !S.ok) why = `You built: <span class="hz">${esc(S.placed.map(i => q.tiles[i]).join(""))}</span>` + (why ? "<br>" + why : "");
    h += `<div class="feedback ${S.ok ? "ok" : "no"}"><div class="verdict">${S.ok ? "对了！ Correct" : "不对 Not quite"}</div>${revealBlock(q)}${why ? `<div class="why">${why}</div>` : ""}${q.pattern ? `<div><button class="btn sm ghost" data-act="gopen" data-id="${q.pattern.id}">Review: ${esc(q.pattern.name)}</button></div>` : ""}</div>`;
    h += `<div class="sticky-next"><button class="btn primary block" data-act="next" id="nextbtn">${S.i + 1 >= n ? "See results" : "Next"}</button></div>`;
  }
  h += `<div class="kbd-hint">Keys: 1–4 choose · Enter check / next · R replay</div></section>`;
  return h;
}
function viewSummary() {
  const c = S.res.filter(r => r.ok).length;
  const word = c === S.res.length ? "太棒了！ Perfect round" : c >= S.res.length - 1 ? "很好！ Great work" : c >= 2 ? "不错 Getting there" : "加油！ Keep going";
  let h = `<section class="stack"><div class="card stack" style="text-align:center"><div class="eyebrow">${esc(S.title)}</div><div class="hz" style="font-size:44px;color:var(--jade)">${c} / ${S.res.length}</div><div style="font-weight:600">${word}</div><div class="muted" style="font-size:13px">Missed items come back in about 10 minutes. Correct ones space out: 1 day, 3 days, then longer.</div></div>`;
  h += `<div class="card"><div class="sumlist">` + S.res.map(r => {
    const t = r.q.reveal || {};
    return `<div class="sumrow"><span class="mk ${r.ok ? "ok" : "no"}">${r.ok ? "✓" : "✗"}</span><div style="flex:1;min-width:0"><div class="hz" style="font-size:17px">${esc(t.zh || "")}</div><div class="muted" style="font-size:13px">${esc(t.en || "")}</div></div>${t.zh ? spk(t.zh) : ""}</div>`;
  }).join("") + `</div></div>`;
  h += `<div class="row"><button class="btn primary" data-act="again">Another round</button><button class="btn" data-act="quit">Done</button></div></section>`;
  return h;
}

async function runScan() {

  const prompt = `Help an HSK 2 Mandarin learner read and order from a Chinese menu. ${sc.file ? "The attached image is a photo of a menu." : ""} ${t.trim() ? "Menu text: " + t.trim() : ""}

{"zh":"name in simplified characters","py":"pinyin with tone marks, one space between syllables","en":"short English name","what":"main ingredients and cooking method, under 15 words","spicy":0,"price":"price as shown, or empty","order":"natural way to order one, e.g. 来一份宫保鸡丁","order_py":"pinyin of order with tone marks"}

  try {

/* waiter chat */
function chatInit() {
  const greet = { zh: "欢迎光临！请问几位？", py: "huān yíng guāng lín! qǐng wèn jǐ wèi?", en: "Welcome! How many people?", fix: null };
  const rules = `You are a friendly waiter (服务员) at ${RESTAURANT.zh}, a casual restaurant in China. The customer is Joel, an Australian learner at about HSK 2 whose weakest skills are listening and grammar. Menu with prices in yuan: ${MENU_TEXT}.
Rules:
- Stay in character. Speak natural, simple Mandarin (HSK 1 to 3 words), one or two short sentences per turn, the way a real waiter talks.
- The customer may write characters, pinyin, or English when stuck. Understand them and keep the scene going in Chinese.
- If the customer's Chinese has a grammar, word-order, measure word or word-choice mistake, or they used English or pinyin, put a natural version in "fix". If what they said was fine, "fix" is null.
- Move the scene along: seating, ordering, drinks, spice level, food arriving, paying by WeChat or Alipay, takeaway boxes.
Reply with only JSON: {"zh":"...","py":"pinyin with tone marks, one space between syllables","en":"English translation","fix":null or {"better":"natural Chinese","better_py":"pinyin","why":"one short sentence in English"}}`;
  state.chat = { turns: [{ role: "user", content: rules + "\n\nThe customer has just walked in. Greet them." }, { role: "assistant", content: JSON.stringify(greet) }], msgs: [{ who: "w", ...greet }], busy: false, listen: true, shown: {}, err: "" };
}
function vWaiter() {
  if (!SAMPLE) return `<div class="card stack"><h3>Order from a waiter</h3><p class="muted" style="margin:0">A live roleplay where Claude plays the waiter, speaks every line aloud and quietly corrects your Chinese. ${STANDALONE ? "Add an Anthropic API key under Progress › Claude features to switch it on." : "It isn't available in this view. Open the page in the Claude app while signed in to use it."} The scripted dialogues under Drills work everywhere.</p></div>`;
  const c = state.chat;
  if (!c) return `<div class="card stack"><h3>Order from a waiter</h3><p class="muted" style="margin:0;font-size:14px">Claude plays the waiter at ${RESTAURANT.zh} using the practice menu. Each line is spoken aloud with the text hidden, so you listen first. Reply in characters, pinyin, or English if you're stuck; corrections appear under your message.</p><button class="btn primary" data-act="chatstart">Walk in</button></div>`;
  let h = `<div class="row"><label class="sw"><input type="checkbox" id="chatlisten" data-act-change="chatlisten" ${c.listen ? "checked" : ""}> Listen first (tap a line to see it)</label><button class="btn sm ghost" data-act="chatreset" style="margin-left:auto">Start over</button></div><div class="chat" id="chat">`;
  c.msgs.forEach((m, i) => {
    if (m.who === "w") {
      const hide = c.listen && !c.shown[i];
      h += `<div class="msg w"><div class="row" style="gap:6px">${spk(m.zh)}<button class="iconbtn" data-act="slow" data-t="${esc(m.zh)}" aria-label="Play slowly">${ICON.slow}</button></div><div class="${hide ? "hidden-text" : ""}" data-act="chatshow" data-i="${i}"><div class="hz">${esc(m.zh)}</div><div class="py" style="font-size:13px">${pyHtml(m.py)}</div><div class="muted" style="font-size:13px">${esc(m.en)}</div></div></div>`;
    } else {
      h += `<div class="msg me"><div class="sc">${esc(m.text)}</div>${m.fix ? `<div class="fix"><div class="row" style="gap:6px"><span class="hz" style="font-size:16px">${esc(m.fix.better)}</span>${spk(m.fix.better)}</div><div class="py" style="font-size:12px">${pyHtml(m.fix.better_py || "")}</div><div class="muted">${esc(m.fix.why || "")}</div></div>` : ""}</div>`;
    }

}
async function chatSend(text) {
  const c = state.chat; if (!text.trim() || c.busy) return;
  const me = { who: "me", text: text.trim(), fix: null };
  c.msgs.push(me); c.turns.push({ role: "user", content: text.trim() });
  c.busy = true; c.err = ""; render();
  const turns = [c.turns[0], ...c.turns.slice(1).slice(-16)];
  try {
    const r = await SAMPLE.json(turns, { modelTier: "quick", cache: false });
    if (!r || !r.zh) throw { code: "invalid_json" };
    me.fix = r.fix && r.fix.better ? r.fix : null;
    c.turns.push({ role: "assistant", content: JSON.stringify(r) });
    c.msgs.push({ who: "w", zh: r.zh, py: r.py || "", en: r.en || "" });
    c.busy = false; render(); speak(r.zh);
  } catch (e) {
    c.turns.pop(); c.busy = false; c.err = errText(e); render();

}

/* ===================== HOLD SHIFT FOR PINYIN ===================== */
/* Holding Shift puts tone-coloured pinyin over every Chinese character on screen.
   Uses the pinyin-pro library (loaded on demand) so it works on any text,
   including menus scanned by Claude and waiter replies. */
const SPY = { on: false, lib: null, loading: null, obs: null, busy: false };
const HAN_RUN = /[㐀-䶿一-鿿豈-﫿]+/g;
function loadPinyinLib() {
  if (SPY.lib) return Promise.resolve(SPY.lib);
  if (SPY.loading) return SPY.loading;
  SPY.loading = new Promise(res => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js";
    s.onload = () => { SPY.lib = window.pinyinPro || null; res(SPY.lib); };
    s.onerror = () => { SPY.loading = null; res(null); };
    document.head.appendChild(s);
  });
  return SPY.loading;
}
function spyAnnotate(root) {
  if (!SPY.lib || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentElement;
      if (!p || p.closest("ruby.xlpy, script, style, textarea, input, select, option, [contenteditable]")) return NodeFilter.FILTER_REJECT;
      HAN_RUN.lastIndex = 0;
      return HAN_RUN.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const text = n.nodeValue, frag = document.createDocumentFragment();
    let last = 0, m;
    HAN_RUN.lastIndex = 0;
    while ((m = HAN_RUN.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const run = m[0], chars = Array.from(run);
      let pys = [];
      try { pys = SPY.lib.pinyin(run, { type: "array" }); } catch (err) { pys = []; }
      chars.forEach((c, k) => {
        const r = document.createElement("ruby");
        r.className = "xlpy";
        r.appendChild(document.createTextNode(c));
        const rt = document.createElement("rt");
        const py = pys.length === chars.length ? pys[k] : "";
        rt.textContent = py;
        rt.className = "t" + toneOf(py);
        r.appendChild(rt);
        frag.appendChild(r);
      });
      last = m.index + run.length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
}
function spyStrip() {
  document.querySelectorAll("ruby.xlpy").forEach(r => {
    const t = document.createTextNode(r.firstChild ? r.firstChild.nodeValue : "");
    const p = r.parentNode;
    p.replaceChild(t, r);
    p.normalize();
  });
}
function spyRun(fn) {
  if (SPY.obs) SPY.obs.disconnect();
  fn();
  if (SPY.on && SPY.obs) SPY.obs.observe(document.body, { childList: true, subtree: true, characterData: true });
}
async function shiftPinyinOn() {
  if (SPY.on) return;
  SPY.on = true;
  document.body.classList.add("shiftpy");
  const lib = await loadPinyinLib();
  if (!SPY.on || !lib) { if (!lib) document.body.classList.remove("shiftpy"); return; }
  if (!SPY.obs) SPY.obs = new MutationObserver(() => { if (SPY.on && !SPY.busy) { SPY.busy = true; spyRun(() => spyAnnotate(document.body)); SPY.busy = false; } });
  spyRun(() => spyAnnotate(document.body));
}
function shiftPinyinOff() {
  if (!SPY.on) return;
  SPY.on = false;
  if (SPY.obs) SPY.obs.disconnect();
  spyStrip();
  document.body.classList.remove("shiftpy");
}
document.addEventListener("keydown", e => {
  if (e.key !== "Shift" || e.repeat) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || tag === "select" || e.target.isContentEditable) return;
  shiftPinyinOn();
});
document.addEventListener("keyup", e => { if (e.key === "Shift") shiftPinyinOff(); });
window.addEventListener("blur", shiftPinyinOff);
document.addEventListener("visibilitychange", () => { if (document.hidden) shiftPinyinOff(); });
setTimeout(loadPinyinLib, 1500);

/* ===================== BOOT ===================== */
setSync("local");
render();
initCloud();

</script>
